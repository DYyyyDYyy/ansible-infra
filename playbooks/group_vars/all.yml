---
# Settings shared by every environment, derived from the inventory groups.
# Environment-specific values (connection, IPs, secrets) are in inventories/<env>/.
#
# Note: group_vars next to the playbook take precedence over inventory
# group_vars, so do not try to override these from inventories/<env>/.

app_port: 8000
app_db_name: transport_firm
app_db_user: transport
app_db_password: "{{ vault_db_password }}"
app_db_host: "{{ hostvars[groups['database'][0]]['private_ip'] }}"

# Here and not in lb.yml: deploy.yml renders the upstream while running on an
# app host, and delegate_to keeps the vars of the delegating host.
nginx_upstream_hosts: "{{ groups['app'] }}"
nginx_upstream_port: "{{ app_port }}"

# Monitoring and backup host(s)
ops_ips: "{{ groups['operations'] | map('extract', hostvars, 'private_ip') | list }}"

# Every host runs node_exporter, reachable from the monitoring host only.
node_exporter_listen_address: "{{ private_ip }}"

# Firewall: rules every host gets, plus firewall_group_rules from the
# host's group file (app.yml, database.yml, ...).
firewall_rules: "{{ firewall_common_rules + firewall_group_rules }}"
firewall_common_rules:
  - name: node-exporter-from-ops
    port: 9100
    sources: "{{ ops_ips }}"
firewall_group_rules: []

# Backups: the db host pushes to rest-server on the ops host.
backup_rest_user: db
backup_rest_port: 8000
