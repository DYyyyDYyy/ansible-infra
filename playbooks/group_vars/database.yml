---
postgresql_listen_addresses: "localhost,{{ private_ip }}"
postgresql_users:
  - name: "{{ app_db_user }}"
    password: "{{ app_db_password }}"
postgresql_databases:
  - name: "{{ app_db_name }}"
    owner: "{{ app_db_user }}"
postgresql_hba_entries:
  - database: "{{ app_db_name }}"
    user: "{{ app_db_user }}"
    address: "{{ groups['app'] | map('extract', hostvars, 'private_ip') | map('regex_replace', '$', '/32') | list }}"

postgres_exporter_listen_address: "{{ private_ip }}"

backup_repository: rest:http://{{ ops_ips[0] }}:{{ backup_rest_port }}/{{ backup_rest_user }}/
backup_rest_password: "{{ vault_backup_password }}"
backup_restic_password: "{{ vault_restic_password }}"
backup_databases: ["{{ app_db_name }}"]

firewall_group_rules:
  - name: postgres-from-app
    port: 5432
    sources: "{{ groups['app'] | map('extract', hostvars, 'private_ip') | list }}"
  - name: postgres-exporter-from-ops
    port: 9187
    sources: "{{ ops_ips }}"
