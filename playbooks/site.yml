---
# Converge every host to the desired state. Safe to re-run: a second run
# reports changed=0 (checked in CI by scripts/check-idempotence.sh).

- name: Baseline for every host
  hosts: all
  become: true
  roles:
    - common
    - firewall
    - node_exporter

# Before the database: the backup role initialises its repository here.
- name: Backup storage and monitoring
  hosts: operations
  become: true
  roles:
    - restic_server
    - monitoring

- name: Database
  hosts: database
  become: true
  roles:
    - postgresql
    - postgres_exporter
    - backup

- name: Load balancer
  hosts: loadbalancer
  become: true
  roles:
    - nginx

# The app tier always goes through the rolling deploy, so changing
# app_version and re-running site.yml never takes both servers down.
- name: App servers
  ansible.builtin.import_playbook: deploy.yml
