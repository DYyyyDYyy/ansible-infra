---
nginx_listen_port: 80
nginx_server_name: _

# Backends: inventory hostnames, each with a `private_ip` host variable.
# Defined in group_vars/all, not lb, because deploy.yml renders the upstream
# from an app host's context (delegate_to keeps the delegating host's vars).
nginx_upstream_hosts: []
nginx_upstream_port: 8000
# Hosts marked `down`: nginx sends them no new requests. Used by deploy.yml.
nginx_upstream_down: []

# Who may read /nginx_status (stub_status), e.g. the Prometheus exporter.
nginx_status_allow:
  - 127.0.0.1
