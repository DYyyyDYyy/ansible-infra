---
# Extra packages on top of the per-distro baseline in vars/<os_family>.yml.
common_extra_packages: []

# Admin accounts. Each user is added to common_admin_group, which gets sudo.
# ssh_keys is the complete list: keys not listed here are removed.
#   - name: alice
#     ssh_keys:
#       - ssh-ed25519 AAAA... alice@laptop
common_admin_users: []
common_admin_group: admins
common_sudo_nopasswd: true

# sshd hardening (written to sshd_config.d/10-hardening.conf)
common_sshd_port: 22
common_sshd_max_auth_tries: 3
# Empty list: do not restrict by group. Careful: if set, include the group of
# the user Ansible connects as (e.g. vagrant), or you lock yourself out.
common_sshd_allow_groups: []

# Install security updates automatically (unattended-upgrades / dnf-automatic).
common_auto_updates: true
common_auto_updates_reboot: false
