---
# Comma-separated, as in postgresql.conf. Set to the private IP to accept
# connections from other hosts; the firewall decides who may reach the port.
postgresql_listen_addresses: localhost
postgresql_port: 5432

# Extra postgresql.conf settings, written to conf.d/90-ansible.conf.
postgresql_settings: {}

# Network clients (pg_hba "host" lines). Local connections always use peer auth.
# address may be a single CIDR or a list of them.
#   - { database: transport, user: transport, address: [10.10.10.11/32, 10.10.10.12/32] }
postgresql_hba_entries: []

# Passwords should come from Ansible Vault.
#   - { name: transport, password: "{{ vault_db_password }}" }
postgresql_users: []
#   - { name: transport, owner: transport }
postgresql_databases: []
