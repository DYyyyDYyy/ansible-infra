---
- name: Install postgres_exporter {{ postgres_exporter_version }}
  ansible.builtin.include_role:
    name: upstream_binary
  vars:
    upstream_binary_name: postgres_exporter
    upstream_binary_github: prometheus-community/postgres_exporter
    upstream_binary_version: "{{ postgres_exporter_version }}"
    upstream_binary_file: postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz
    upstream_binary_sha256: "{{ postgres_exporter_sha256 }}"

- name: Create the service account
  ansible.builtin.user:
    name: postgres_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the database role
  community.postgresql.postgresql_user:
    name: postgres_exporter
    role_attr_flags: LOGIN
    login_port: "{{ postgres_exporter_postgresql_port }}"
  become: true
  become_user: postgres

- name: Grant pg_monitor
  community.postgresql.postgresql_membership:
    groups: [pg_monitor]
    target_roles: [postgres_exporter]
    login_port: "{{ postgres_exporter_postgresql_port }}"
  become: true
  become_user: postgres

- name: Install the systemd unit
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart postgres_exporter

- name: Enable and start postgres_exporter
  ansible.builtin.systemd_service:
    name: postgres_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Apply a pending restart
  ansible.builtin.meta: flush_handlers

# pg_up 1 means the exporter really reached PostgreSQL, not only that it runs.
- name: Wait until the exporter reports PostgreSQL as up
  ansible.builtin.uri:
    url: http://{{ postgres_exporter_listen_address }}:{{ postgres_exporter_port }}/metrics
    return_content: true
  register: postgres_exporter_metrics
  until: postgres_exporter_metrics.content is defined and postgres_exporter_metrics.content is search('(?m)^pg_up 1$')
  retries: 15
  delay: 1
  changed_when: false
