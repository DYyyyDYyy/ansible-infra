---
- name: Install blackbox_exporter {{ monitoring_blackbox_version }}
  ansible.builtin.include_role:
    name: upstream_binary
  vars:
    upstream_binary_name: blackbox_exporter
    upstream_binary_github: prometheus/blackbox_exporter
    upstream_binary_version: "{{ monitoring_blackbox_version }}"
    upstream_binary_file: blackbox_exporter-{{ monitoring_blackbox_version }}.linux-amd64.tar.gz
    upstream_binary_sha256: "{{ monitoring_blackbox_sha256 }}"

- name: Create /etc/blackbox_exporter
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the probe modules
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: root
    group: root
    mode: "0644"
    validate: /opt/blackbox_exporter-{{ monitoring_blackbox_version }}/blackbox_exporter --config.check --config.file=%s
  notify: Reload blackbox_exporter

- name: Install the blackbox_exporter unit
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart blackbox_exporter

- name: Enable and start blackbox_exporter
  ansible.builtin.systemd_service:
    name: blackbox_exporter
    state: started
    enabled: true
    daemon_reload: true
