---
galaxy_info:
  role_name: backup
  author: Didukh Sviatoslav
  description: Hourly pg_dump into an append-only restic repository, with a freshness metric for Prometheus
  license: MIT
  min_ansible_version: "2.18"
  # restic is packaged by Debian; Rocky only has it in EPEL (which the Rocky
  # test image happens to ship, a clean box does not). The db host is Debian.
  platforms:
    - name: Debian
      versions: [trixie]
dependencies: []
