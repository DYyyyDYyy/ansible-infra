---
# Debian only, see meta/main.yml. Lists are not merged with the shared
# config, so this replaces its platforms.
scenario:
  name: default
platforms:
  - name: debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
