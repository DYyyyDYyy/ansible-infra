---
- name: Converge
  hosts: all
  vars:
    firewall_rules:
      - name: http
        port: 80
      - name: app-from-lb
        port: 8000
        sources: [192.0.2.10]
      - name: metrics
        port: [9100, 9187]
        sources: [192.0.2.0/24, "2001:db8::/32"]
      - name: dns
        port: 53
        proto: udp
  roles:
    - role: firewall
