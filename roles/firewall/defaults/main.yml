---
# Inbound policy is drop. Loopback, established/related traffic, ICMP and SSH
# are always allowed; everything else must be listed in firewall_rules.
#
# The role owns one table, `inet filter`, and replaces only that one, so
# tables created by others survive a reload (Docker's DNAT rules for its
# embedded DNS, for one). Their accept rules cannot open anything this table
# drops: a packet has to pass every base chain on the same hook.
#
# WARNING: the forward chain's policy is drop, so on a host that routes
# traffic for containers or VMs (Docker, Podman, libvirt) that traffic is
# blocked. Do not apply this role to such hosts as it is.

firewall_ssh_port: 22
# Empty list: SSH from anywhere (keys only, see the common role).
firewall_ssh_sources: []

# Each rule:
#   name: shown as the nft rule comment
#   port: 80, "8000-8010" or a list of ports
#   proto: tcp (default) or udp
#   sources: IPv4/IPv6 addresses or CIDRs; empty or missing means anywhere
firewall_rules: []

# Log dropped packets to the kernel log, rate limited.
firewall_log_dropped: true
