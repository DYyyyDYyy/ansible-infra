---
# Pinned upstream release. Rocky has no node_exporter package without EPEL,
# so both distros get the same binary from GitHub, verified by checksum.
node_exporter_version: 1.12.1
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63

# Set to the private IP in the real topology; the firewall only lets the
# monitoring host reach the port.
node_exporter_listen_address: 127.0.0.1
node_exporter_port: 9100

# *.prom files here are exported as metrics. Other jobs (the backup timer)
# drop their own metrics into this directory.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile
