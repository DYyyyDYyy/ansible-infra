---
- name: Install node_exporter {{ node_exporter_version }}
  ansible.builtin.include_role:
    name: upstream_binary
  vars:
    upstream_binary_name: node_exporter
    upstream_binary_github: prometheus/node_exporter
    upstream_binary_version: "{{ node_exporter_version }}"
    upstream_binary_file: node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    upstream_binary_sha256: "{{ node_exporter_sha256 }}"

- name: Create the service account
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/node_exporter
    create_home: false

# Root-owned and not writable by node_exporter: whoever can write here can
# publish any metric. Jobs that report metrics write as root (see the
# backup role's ExecStartPost=+).
- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ node_exporter_textfile_dir | dirname }}"
    - "{{ node_exporter_textfile_dir }}"

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Apply a pending restart
  ansible.builtin.meta: flush_handlers

- name: Wait for the metrics endpoint
  ansible.builtin.uri:
    url: http://{{ node_exporter_listen_address }}:{{ node_exporter_port }}/metrics
  register: node_exporter_metrics
  until: node_exporter_metrics.status == 200
  retries: 10
  delay: 1
  changed_when: false
