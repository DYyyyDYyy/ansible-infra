---
# Shared Molecule config, deep-merged under every roles/*/molecule/*/molecule.yml.
# Each platform is a container running real systemd, so services, timers and
# unit sandboxing behave the way they do on a VM.
# Roles live in this repo (roles/) and collections are installed by `make venv`
# into .collections, so Molecule does not need to install anything itself.
prerun: false
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    override_command: false  # keep the image's CMD, which is systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: rocky10
    image: geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

ansible:
  env:
    # MOLECULE_PROJECT_DIRECTORY is roles/<role>, so its parent is roles/
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  cfg:
    defaults:
      callback_result_format: yaml
      interpreter_python: auto_silent
  executor:
    args:
      ansible_playbook:
        - --diff

verifier:
  name: testinfra
  options:
    v: true

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
