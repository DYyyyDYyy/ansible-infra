---
# VMs from the Vagrantfile (make up). Ansible connects over the private
# network with the per-VM key that vagrant-libvirt generates.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: .vagrant/machines/{{ inventory_hostname }}/libvirt/private_key
  children:
    lb:
      hosts:
        lb: { ansible_host: 10.10.10.10, private_ip: 10.10.10.10 }
    app:
      hosts:
        app1: { ansible_host: 10.10.10.11, private_ip: 10.10.10.11 }
        app2: { ansible_host: 10.10.10.12, private_ip: 10.10.10.12 }
    db:
      hosts:
        db: { ansible_host: 10.10.10.13, private_ip: 10.10.10.13 }
