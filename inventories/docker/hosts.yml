---
# systemd containers that stand in for the Vagrant VMs: same hosts, same
# distros, same layout. playbooks/lab.yml creates them from this file
# (make up ENV=docker) and Ansible talks to them with `docker exec`.
all:
  children:
    lab:
      vars:
        ansible_connection: community.docker.docker
      children:
        lb:
          hosts:
            lb:
              ansible_host: lab-lb
              private_ip: 10.10.20.10
              lab_image: geerlingguy/docker-rockylinux10-ansible:latest
              lab_published_ports: ["127.0.0.1:8080:80"]
        app:
          hosts:
            app1:
              ansible_host: lab-app1
              private_ip: 10.10.20.11
              lab_image: geerlingguy/docker-debian13-ansible:latest
            app2:
              ansible_host: lab-app2
              private_ip: 10.10.20.12
              lab_image: geerlingguy/docker-rockylinux10-ansible:latest
        db:
          hosts:
            db:
              ansible_host: lab-db
              private_ip: 10.10.20.13
              lab_image: geerlingguy/docker-debian13-ansible:latest
